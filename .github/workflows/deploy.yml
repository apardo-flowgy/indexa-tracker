name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7,11,15,19 * * *"   # 4x día: 9h, 13h, 17h, 21h hora España
  workflow_dispatch:        # permite lanzarlo manualmente desde Actions

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Build y actualización de datos van en un job SIN `environment:`, para que
  # nunca queden en estado "waiting" a la espera de la cola de Pages. Si un
  # deploy se atasca, los datos se siguen actualizando y commiteando.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: build-data      # grupo propio, independiente del de Pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run update-data

      - name: Commit historical client data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/clients_history.csv
          if git diff --staged --quiet; then
            echo "Sin cambios en clients_history.csv"
            exit 0
          fi
          git commit -m "data: update clients history [skip ci]"
          git pull --rebase --autostash origin main
          git push || echo "::warning::No se pudo empujar el commit de datos; se reintentará en la próxima ejecución"

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      # No cancelar despliegues en curso: cancelar un deploy de Pages a mitad
      # provoca fallos intermitentes en actions/deploy-pages (recomendación oficial).
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          # 5 min en vez de los 10 por defecto: si la cola de Pages está
          # atascada, falla pronto y libera el grupo de concurrencia.
          timeout: 300000
